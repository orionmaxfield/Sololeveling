<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04070f; --panel:rgba(12,26,51,.72);
  --line:rgba(77,208,255,.34); --lineSoft:rgba(77,208,255,.14);
  --cyan:#4dd0ff; --amber:#f5a524; --red:#ff4d6d; --green:#4ade80;
  --text:#dfefff; --mute:#7d95b5;
  --cut:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh; background:radial-gradient(120% 80% at 50% 0%,#0b1730 0%,var(--void) 62%);
  background-attachment:fixed; color:var(--text);
  font-family:Rajdhani,system-ui,sans-serif; overflow-x:hidden;
}
#grid{
  position:fixed; inset:0; pointer-events:none; opacity:.35; z-index:0;
  background-image:linear-gradient(var(--lineSoft) 1px,transparent 1px),linear-gradient(90deg,var(--lineSoft) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(90% 60% at 50% 0%,#000 0%,transparent 75%);
  mask-image:radial-gradient(90% 60% at 50% 0%,#000 0%,transparent 75%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 15px 106px}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{display:block}

.panel{
  position:relative;background:var(--panel);padding:16px;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  box-shadow:inset 0 0 0 1px var(--lineSoft);
}
.panel.glow{box-shadow:inset 0 0 0 1px var(--line),0 0 26px rgba(77,208,255,.10)}
.panel.p0{padding:0}.panel.p13{padding:13px}.panel.p14{padding:14px}.panel.p18{padding:18px}
.stack{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:10px}
.sp{height:14px}.sp8{height:9px}.sp20{height:20px}
.flex1{flex:1;min-width:0}

.eyebrow{font-family:'Chakra Petch',monospace;font-size:10px;letter-spacing:.3em;
  color:var(--cyan);text-transform:uppercase;opacity:.85;margin-bottom:8px}
.hd{font-family:'Chakra Petch',sans-serif}
.mono{font-family:'Chakra Petch',monospace}
.mute{color:var(--mute)}

.btn{
  background:rgba(77,208,255,.11);color:var(--cyan);border:0;
  box-shadow:inset 0 0 0 1px rgba(77,208,255,.4);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  padding:11px 18px;font-family:Rajdhani,sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.small{padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.gold{background:rgba(245,165,36,.11);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(245,165,36,.4)}
.btn.ghost{background:rgba(125,149,181,.10);color:var(--mute);box-shadow:inset 0 0 0 1px rgba(125,149,181,.32)}
.btn[disabled]{background:rgba(255,255,255,.04);color:var(--mute);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);cursor:not-allowed}
.icobtn{background:none;border:0;color:rgba(255,255,255,.2);cursor:pointer;padding:0 13px}
.icobtn:hover{color:var(--red)}

.field{
  width:100%;background:rgba(255,255,255,.05);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--lineSoft);border:0;outline:0;
  padding:11px 13px;font-family:Rajdhani,sans-serif;font-size:16px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
input[type=date].field{min-height:44px}

.bar{height:7px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bar.tall{height:9px}

.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-weight:700}

.box{width:21px;height:21px;display:grid;place-items:center;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}

.check{width:52px;background:transparent;border:0;cursor:pointer;display:grid;place-items:center;
  color:var(--mute);box-shadow:inset -1px 0 0 var(--lineSoft)}
.check.on{background:rgba(77,208,255,.12);color:var(--cyan)}

.tag{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.14em;
  display:inline-flex;align-items:center;gap:4px}
.linkish{background:none;border:0;padding:0;cursor:pointer;font-family:'Chakra Petch',sans-serif;
  font-size:10px;letter-spacing:.16em}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(4,7,15,.93);
  box-shadow:inset 0 1px 0 var(--lineSoft);backdrop-filter:blur(8px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav>div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;cursor:pointer;padding:11px 0 13px;color:var(--mute);
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--cyan)}
nav button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
nav span{font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dot{position:absolute;top:8px;right:26%;width:7px;height:7px;border-radius:50%;
  background:var(--red);box-shadow:0 0 8px var(--red)}

#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(7,13,28,.96);color:var(--cyan);padding:11px 18px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  box-shadow:inset 0 0 0 1px var(--line);font-size:15px;letter-spacing:.04em;
  max-width:88vw;text-align:center;display:none}
#toast.bad{color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,77,109,.5)}

#modal{position:fixed;inset:0;z-index:90;background:rgba(2,4,10,.86);
  display:none;place-items:center;padding:22px;cursor:pointer}
#modal.on{display:grid}
.win{width:100%;max-width:380px;background:rgba(8,17,36,.97);padding:30px;text-align:center;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
  animation:pop .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.965)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.win{animation:none}.bar>i{transition:none}}

.medals{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.case{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pick{background:rgba(255,255,255,.04);border:0;cursor:pointer;padding:9px 0;color:var(--mute);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px}
.spark>div{flex:1;height:100%;display:flex;align-items:flex-end}
.spark i{display:block;width:100%;background:rgba(255,255,255,.06)}
label.chk{display:flex;gap:11px;align-items:center;cursor:pointer;font-size:15px}
label.chk input{width:17px;height:17px;accent-color:var(--red);flex-shrink:0}
</style>
</head>
<body>
<div id="grid"></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
(function(){
"use strict";

/* ─── icons ────────────────────────────────────────────── */
function svg(d,extra,size){
  return '<svg width="'+(size||16)+'" height="'+(size||16)+'" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
    d+(extra||'')+'</svg>';
}
var I = {
  str:  svg('<path d="M4 20 L19 5"/><path d="M14 5h5v5"/><path d="M4 20h4"/><path d="M4 20v-4"/>'),
  agi:  svg('<path d="M3 8h9a3 3 0 1 0-3-3"/><path d="M3 12h13a3 3 0 1 1-3 3"/><path d="M3 16h7"/>'),
  vit:  svg('<path d="M12 20s-7-4.2-9-8C1.2 8.6 3.4 5 6.6 5 8.7 5 10.4 6.2 12 8.2 13.6 6.2 15.3 5 17.4 5 20.6 5 22.8 8.6 21 12c-2 3.8-9 8-9 8z"/>'),
  int:  svg('<path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M19 16H6a2 2 0 0 0-2 2"/><path d="M9 7h6"/>'),
  per:  svg('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',null,19),
  target:svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',null,19),
  scroll:svg('<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h7"/><path d="M8 12h7"/><path d="M8 16h4"/>',null,19),
  store:svg('<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/>',null,19),
  bag:  svg('<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',null,19),
  check:svg('<path d="M4 12l5 5L20 6"/>',null,13),
  plus: svg('<path d="M12 5v14"/><path d="M5 12h14"/>',null,15),
  trash:svg('<path d="M4 6h16"/><path d="M9 6V4h6v2"/><path d="M6 6l1 15h10l1-15"/>',null,15),
  coins:svg('<circle cx="9" cy="9" r="5"/><path d="M13.5 5.2A5 5 0 1 1 16 15.5"/>',null,15),
  flame:svg('<path d="M12 22c4 0 7-3 7-7 0-4-4-6-4-10-3 2-4 4.5-4 6.5C11 10 10 9 9 8c-1 2-4 4-4 7 0 4 3 7 7 7z"/>',null,13),
  lock: svg('<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/>',null,13),
  chev: svg('<path d="M6 9l6 6 6-6"/>',null,17),
  alert:svg('<path d="M12 3l10 18H2z"/><path d="M12 9v5"/><path d="M12 17.6v.4"/>',null,15),
  trophy:svg('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 3"/><path d="M17 5h3a3 3 0 0 1-3 3"/><path d="M10 14h4v5h-4z"/><path d="M8 19h8"/>',null,14)
};

/* ─── data model ───────────────────────────────────────── */
var KEY='the-system-v1';
var STATS=[
 {k:'STR',name:'Strength',    ico:'str',c:'#ff6b7d',hint:'Lifting, resistance work, physical effort, hard chores'},
 {k:'AGI',name:'Agility',     ico:'agi',c:'#4ade80',hint:'Walking, running, sport, mobility, getting outside'},
 {k:'VIT',name:'Vitality',    ico:'vit',c:'#f5a524',hint:'Sleep, food, water, rest, appointments kept'},
 {k:'INT',name:'Intelligence',ico:'int',c:'#4dd0ff',hint:'Study, reading, skills, budgeting, saving, work on the business'},
 {k:'PER',name:'Perception',  ico:'per',c:'#a78bfa',hint:'Stillness, prayer, journaling, people you love, self-honesty'}
];
var SM={}; STATS.forEach(function(s){SM[s.k]=s;});

var RANKS=[{min:70,r:'S',c:'#f5a524'},{min:50,r:'A',c:'#ff6b7d'},{min:35,r:'B',c:'#a78bfa'},
           {min:20,r:'C',c:'#4dd0ff'},{min:10,r:'D',c:'#4ade80'},{min:1,r:'E',c:'#7d95b5'}];
function rankOf(l){for(var i=0;i<RANKS.length;i++){if(l>=RANKS[i].min)return RANKS[i];}return RANKS[5];}
function rankColor(r){for(var i=0;i<RANKS.length;i++){if(RANKS[i].r===r)return RANKS[i].c;}return '#4dd0ff';}

var DIFF={E:{xp:60,p:30},D:{xp:120,p:60},C:{xp:220,p:120},B:{xp:400,p:220},A:{xp:700,p:400},S:{xp:1200,p:800}};

var MEDALS=[
 {id:'star',  name:'Gold Star',       sym:'★',cost:50,  tier:'Common',   color:'#f5d24a',desc:'The classic. Proof you showed up.'},
 {id:'bronze',name:'Bronze Medal',    sym:'◉',cost:120, tier:'Common',   color:'#c08457',desc:'For a week that held together.'},
 {id:'shard', name:'Mana Shard',      sym:'◈',cost:200, tier:'Uncommon', color:'#4dd0ff',desc:'A small piece of stored effort.'},
 {id:'silver',name:'Silver Medal',    sym:'◉',cost:300, tier:'Uncommon', color:'#cbd5e1',desc:'For finishing something you wanted to quit.'},
 {id:'elixir',name:'Elixir of Life',  sym:'⚗',cost:420, tier:'Uncommon', color:'#4ade80',desc:'Recovery, earned rather than borrowed.'},
 {id:'gold',  name:'Gold Medal',      sym:'◉',cost:600, tier:'Rare',     color:'#f5a524',desc:'Top of the podium in your own house.'},
 {id:'crest', name:"Knight's Crest",  sym:'⛨',cost:850, tier:'Rare',     color:'#4dd0ff',desc:'For keeping your word to yourself.'},
 {id:'dagger',name:"Hunter's Dagger", sym:'⚔',cost:1100,tier:'Rare',     color:'#dfefff',desc:'For the day you went in anyway.'},
 {id:'frag',  name:'Shadow Fragment', sym:'✧',cost:1600,tier:'Epic',     color:'#a78bfa',desc:'Something you feared, now working for you.'},
 {id:'key',   name:'Red Gate Key',    sym:'⚿',cost:2200,tier:'Epic',     color:'#ff4d6d',desc:'Opens the hard thing you keep avoiding.'},
 {id:'sigil', name:"Monarch's Sigil", sym:'⬢',cost:4000,tier:'Legendary',color:'#e879f9',desc:'Sovereign over your own schedule.'},
 {id:'throne',name:'Shadow Throne',   sym:'♛',cost:8000,tier:'Legendary',color:'#f5a524',desc:'The long game, won.'}
];
var MEDAL_MAP={}; MEDALS.forEach(function(m){MEDAL_MAP[m.id]=m;});

function today(){return new Date().toLocaleDateString('en-CA');}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function progress(xp,base,inc){
  var lvl=1,need=base,rem=Math.max(0,xp);
  while(rem>=need&&lvl<999){rem-=need;lvl++;need=base+(lvl-1)*inc;}
  return {lvl:lvl,rem:rem,need:need};
}
function hunterP(xp){return progress(xp,100,60);}
function statP(xp){return progress(xp,50,30);}

function fresh(){
  return {ready:false,name:'',xp:0,points:0,streak:0,best:0,strict:false,
    stats:{STR:0,AGI:0,VIT:0,INT:0,PER:0},
    dailies:[
      {id:'d1',title:'20 push-ups',                stat:'STR',mandatory:true, done:false},
      {id:'d2',title:'Walk or run for 15 minutes', stat:'AGI',mandatory:true, done:false},
      {id:'d3',title:'In bed by a set time',       stat:'VIT',mandatory:true, done:false},
      {id:'d4',title:'Read or study for 20 minutes',stat:'INT',mandatory:false,done:false},
      {id:'d5',title:'5 minutes of stillness',     stat:'PER',mandatory:false,done:false}
    ],
    quests:[],
    shop:[
      {id:'s1',name:'Movie night, no guilt',cost:200, note:'Pick anything. Phone stays down.'},
      {id:'s2',name:'Meal out at the good place',cost:500,note:''},
      {id:'s3',name:'A full day off. No quests.',cost:1200,note:'Streak protected.'}
    ],
    bag:[],lastReset:today(),history:[]};
}

function rollover(d){
  var t=today(); if(d.lastReset===t) return d;
  var mand=d.dailies.filter(function(q){return q.mandatory;});
  var cleared=mand.length>0&&mand.every(function(q){return q.done;});
  if(cleared){d.streak=d.streak+1; d.best=Math.max(d.best||0,d.streak);}
  else if(mand.length>0){d.streak=0; if(d.strict) d.xp=Math.max(0,d.xp-40);}
  d.history=(d.history||[]).concat([{date:d.lastReset,
    done:d.dailies.filter(function(q){return q.done;}).length,
    total:d.dailies.length,cleared:cleared}]).slice(-90);
  d.dailies=d.dailies.map(function(q){q.done=false;return q;});
  d.lastReset=t;
  return d;
}

/* ─── state ────────────────────────────────────────────── */
var D=null, TAB='status', UI={}, QUEUE=[], MODAL=false, TOASTT=null;

function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(D)); }
  catch(e){ toast('Could not save. If you are in private browsing, storage is blocked.',true); }
}
function load(){
  var d=null;
  try{ var raw=localStorage.getItem(KEY); if(raw) d=JSON.parse(raw); }catch(e){ d=null; }
  var base=fresh();
  if(d){ for(var k in d){ if(Object.prototype.hasOwnProperty.call(d,k)) base[k]=d[k]; } }
  if(!base.stats) base.stats={STR:0,AGI:0,VIT:0,INT:0,PER:0};
  var stale=base.lastReset!==today();
  D=rollover(base);
  if(stale) save();   // lock in the new day so reopening can't count it twice
}

function snapshot(){
  var s={h:hunterP(D.xp).lvl,s:{}};
  STATS.forEach(function(x){ s.s[x.k]=statP(D.stats[x.k]).lvl; });
  return s;
}
function apply(fn){
  var before=snapshot();
  fn(D);
  STATS.forEach(function(x){
    var a=statP(D.stats[x.k]).lvl;
    if(a>before.s[x.k]) QUEUE.push({kind:'stat',stat:x,from:before.s[x.k],to:a});
  });
  var ah=hunterP(D.xp).lvl;
  if(ah>before.h){
    var rb=rankOf(before.h).r, ra=rankOf(ah).r;
    QUEUE.push({kind:'level',from:before.h,to:ah,rankUp:ra!==rb?ra:null});
  }
  save(); render(); popModal();
}

function toast(text,bad){
  var el=document.getElementById('toast');
  el.textContent=text; el.className=bad?'bad':''; el.style.display='block';
  clearTimeout(TOASTT);
  TOASTT=setTimeout(function(){el.style.display='none';},2800);
}

/* ─── level-up window ──────────────────────────────────── */
function popModal(){
  var box=document.getElementById('modal');
  if(!QUEUE.length){ MODAL=false; box.className=''; box.innerHTML=''; return; }
  MODAL=true;
  var m=QUEUE.shift();
  var accent = m.kind==='level' ? '#4dd0ff' : m.stat.c;
  var body;
  if(m.kind==='level'){
    body='<div class="hd" style="font-weight:700;font-size:34px;color:#fff;letter-spacing:.06em;text-shadow:0 0 26px '+accent+'">LEVEL UP</div>'+
      '<div style="height:14px"></div>'+
      '<div style="display:flex;align-items:center;justify-content:center;gap:16px">'+
        '<span class="hd" style="font-size:27px;color:var(--mute)">'+m.from+'</span>'+
        '<span style="color:'+accent+';font-size:20px">&#9654;</span>'+
        '<span class="hd" style="font-size:40px;color:'+accent+';text-shadow:0 0 20px '+accent+'">'+m.to+'</span>'+
      '</div>'+
      (m.rankUp?'<div style="margin-top:20px;padding-top:16px;box-shadow:inset 0 1px 0 var(--lineSoft);font-size:17px;color:var(--amber)">You have advanced to <strong>Rank '+m.rankUp+'</strong>.</div>':'');
  } else {
    body='<div class="hd" style="font-weight:700;font-size:25px;color:#fff;letter-spacing:.04em">'+
        m.stat.name.toUpperCase()+' +'+(m.to-m.from)+'</div>'+
      '<div style="height:12px"></div>'+
      '<div class="hd" style="font-size:34px;color:'+accent+';text-shadow:0 0 20px '+accent+'">'+m.stat.k+' '+m.to+'</div>';
  }
  box.innerHTML='<div class="win" style="box-shadow:inset 0 0 0 1px '+accent+'88,0 0 60px '+accent+'33">'+
    '<div class="mono" style="font-size:10.5px;letter-spacing:.42em;color:'+accent+';opacity:.9">NOTIFICATION</div>'+
    '<div style="height:18px"></div>'+body+
    '<div style="height:26px"></div>'+
    '<button class="btn wide" data-act="closemodal">Confirm</button></div>';
  box.className='on';
}

/* ─── small builders ───────────────────────────────────── */
function bar(v,max,color,tall){
  var pct=max>0?Math.min(100,(v/max)*100):0;
  return '<div class="bar'+(tall?' tall':'')+'"><i style="width:'+pct+'%;background:'+color+';box-shadow:0 0 10px '+color+'"></i></div>';
}
function statPicker(sel,ns){
  var h='<div class="five">';
  STATS.forEach(function(s){

  var head='<div class="row" style="gap:12px;margin-bottom:14px">'+
    '<div class="hex" style="width:46px;height:46px;flex-shrink:0;background:'+rk.c+'22;box-shadow:0 0 18px '+rk.c+'44;font-size:21px;color:'+rk.c+'">'+rk.r+'</div>'+

      '<div class="hd" style="display:flex;align-items:center;gap:5px;justify-content:flex-end;color:var(--amber);font-size:17px;font-weight:600">'+I.coins+D.points.toLocaleString()+'</div>'+

    '</div></div>';

  var body = TAB==='status'?viewStatus():TAB==='daily'?viewDaily():
             TAB==='quests'?viewQuests():TAB==='shop'?viewShop():viewBag();
  app.innerHTML=head+body;

  var tabs=[['status','Status','user'],['daily','Daily','target'],['quests','Quests','scroll'],
            ['shop','Shop','store'],['bag','Bag','bag']];
  nav.innerHTML='<div>'+tabs.map(function(t){

var FOCUS=null;
function focusRestore(){
  if(!FOCUS) return;
  var el=document.querySelector('[data-ui="'+FOCUS+'"]');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
  FOCUS=null;
}

/* ─── actions ──────────────────────────────────────────── */
function toggleDaily(id){
  apply(function(d){
    var q=null,i;
    for(i=0;i<d.dailies.length;i++) if(d.dailies[i].id===id) q=d.dailies[i];
    if(!q) return;
    var allBefore=d.dailies.length>0&&d.dailies.every(function(x){return x.done;});
    q.done=!q.done;
    var on=q.done, delta=on?15:-15;
    d.xp=Math.max(0,d.xp+delta);
    d.points=Math.max(0,d.points+(on?10:-10));
    d.stats[q.stat]=Math.max(0,d.stats[q.stat]+delta);
    var allNow=d.dailies.length>0&&d.dailies.every(function(x){return x.done;});
    if(allNow&&!allBefore){ d.xp+=50; d.points+=50; toast('Daily quests cleared. +50 XP  +50 pts'); }
    if(!allNow&&allBefore){ d.xp=Math.max(0,d.xp-50); d.points=Math.max(0,d.points-50); }
  });
}

function handle(act,el){
  var id=el.getAttribute('data-id'), v=el.getAttribute('data-v'), u=el.getAttribute('data-uid');

  if(act==='tab'){ TAB=v; UI.expand=null; render(); return; }
  if(act==='closemodal'){ popModal(); return; }

  if(act==='accept'){
    var n=(UI.oName||'').trim(); if(!n){ toast('Enter a name first.',true); return; }
    apply(function(d){ d.ready=true; d.name=n; }); return;
  }

  if(act==='daily'){ toggleDaily(id); return; }
  if(act==='mand'){ apply(function(d){ d.dailies.forEach(function(q){ if(q.id===id) q.mandatory=!q.mandatory; }); }); return; }
  if(act==='deldaily'){ apply(function(d){ d.dailies=d.dailies.filter(function(q){return q.id!==id;}); }); return; }
  if(act==='opendaily'){ UI.dOpen=true; UI.dStat=UI.dStat||'STR'; render(); return; }
  if(act==='canceldaily'){ UI.dOpen=false; UI.dTitle=''; UI.dMand=false; render(); return; }
  if(act==='adddaily'){
    var t=(UI.dTitle||'').trim(); if(!t){ toast('Give the quest a name.',true); return; }
    var st=UI.dStat||'STR', mn=!!UI.dMand;
    UI.dOpen=false; UI.dTitle=''; UI.dMand=false;
    apply(function(d){ d.dailies.push({id:uid(),title:t,stat:st,mandatory:mn,done:false}); }); return;
  }
  if(act==='pickstat'){ UI[el.getAttribute('data-ns')+'Stat']=v; render(); return; }
  if(act==='pickrank'){ UI.qRank=v; render(); return; }

  if(act==='openquest'){ UI.qOpen=true; UI.qStat=UI.qStat||'INT'; UI.qRank=UI.qRank||'C'; render(); return; }
  if(act==='cancelquest'){ UI.qOpen=false; UI.qTitle=''; UI.qDue=''; render(); return; }
  if(act==='addquest'){
    var qt=(UI.qTitle||'').trim(); if(!qt){ toast('Give the quest a name.',true); return; }
    var qs=UI.qStat||'INT', qr=UI.qRank||'C', qd=UI.qDue||'';
    UI.qOpen=false; UI.qTitle=''; UI.qDue='';
    apply(function(d){ d.quests.push({id:uid(),title:qt,stat:qs,rank:qr,due:qd,steps:[],done:false}); }); return;
  }
  if(act==='expand'){ UI.expand=UI.expand===id?null:id; UI.stepTxt=''; render(); return; }
  if(act==='step'){
    var idx=parseInt(el.getAttribute('data-i'),10);
    apply(function(d){ d.quests.forEach(function(q){ if(q.id===id) q.steps[idx].done=!q.steps[idx].done; }); }); return;
  }
  if(act==='addstep'){
    var s=(UI.stepTxt||'').trim(); if(!s) return; UI.stepTxt='';
    apply(function(d){ d.quests.forEach(function(q){ if(q.id===id) q.steps.push({t:s,done:false}); }); }); return;
  }
  if(act==='delquest'){ apply(function(d){ d.quests=d.quests.filter(function(q){return q.id!==id;}); }); return; }
  if(act==='finish'){
    apply(function(d){
      d.quests.forEach(function(q){
        if(q.id===id&&!q.done){
          var r=DIFF[q.rank];
          d.xp+=r.xp; d.points+=r.p; d.stats[q.stat]+=r.xp;
          q.done=true; q.doneAt=today();
          toast('Quest complete. +'+r.xp+' XP  +'+r.p+' pts');
        }
      });
    }); return;
  }

  if(act==='shoptab'){ UI.shopTab=v; render(); return; }
  if(act==='openreward'){ UI.rOpen=true; render(); return; }
  if(act==='cancelreward'){ UI.rOpen=false; UI.rName=''; UI.rCost=''; UI.rNote=''; render(); return; }
  if(act==='addreward'){
    var rn=(UI.rName||'').trim(), rc=parseInt(UI.rCost,10);
    if(!rn||!rc||rc<1){ toast('Needs a name and a point cost.',true); return; }
    var rnote=(UI.rNote||'').trim();
    UI.rOpen=false; UI.rName=''; UI.rCost=''; UI.rNote='';
    apply(function(d){ d.shop.push({id:uid(),name:rn,cost:rc,note:rnote}); }); return;
  }
  if(act==='delreward'){ apply(function(d){ d.shop=d.shop.filter(function(x){return x.id!==id;}); }); return; }
  if(act==='buyreward'||act==='buymedal'){
    var isMedal=act==='buymedal';
    apply(function(d){
      var it=isMedal?MEDAL_MAP[id]:null;
      if(!isMedal) d.shop.forEach(function(x){ if(x.id===id) it=x; });
      if(!it||d.points<it.cost) return;
      d.points-=it.cost;
      d.bag.push({uid:uid(),refId:it.id,name:it.name,cost:it.cost,
        sym:isMedal?it.sym:null,color:isMedal?it.color:'#4dd0ff',
        kind:isMedal?'medal':'reward',at:today(),used:false});
      toast('Acquired: '+it.name);
    }); return;
  }
  if(act==='claim'){ apply(function(d){ d.bag.forEach(function(b){ if(b.uid===u) b.used=true; }); }); return; }
  if(act==='sell'){
    apply(function(d){
      var it=null; d.bag.forEach(function(b){ if(b.uid===u) it=b; });
      if(!it) return;
      var back=Math.floor(it.cost/2);
      d.points+=back; d.bag=d.bag.filter(function(b){return b.uid!==u;});
      toast('Sold. +'+back+' pts');
    }); return;
  }
  if(act==='reset'){
    if(confirm('Erase everything and start over? This cannot be undone.')){
      try{ localStorage.removeItem(KEY); }catch(e){}
      D=fresh(); UI={}; TAB='status'; render();
    }
    return;
  }
}

/* ─── wiring ───────────────────────────────────────────── */
document.addEventListener('click',function(e){
  var m=document.getElementById('modal');
  if(MODAL&&e.target===m){ popModal(); return; }
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el||el.disabled) return;
  handle(el.getAttribute('data-act'),el);
});
document.addEventListener('input',function(e){
  var el=e.target, key=el.getAttribute&&el.getAttribute('data-ui');
  if(!key) return;
  if(el.type==='checkbox'){ UI[key]=el.checked; return; }
  if(key==='rCost') el.value=el.value.replace(/\D/g,'');
  UI[key]=el.value;
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.getAttribute&&el.getAttribute('data-act')==='strict'){
    apply(function(d){ d.strict=el.checked; });
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&MODAL){ popModal(); return; }
  if(e.key!=='Enter') return;
  var el=e.target, key=el.getAttribute&&el.getAttribute('data-ui');
  if(!key) return;
  e.preventDefault();
  var map={oName:'accept',dTitle:'adddaily',qTitle:'addquest',rName:'addreward',rCost:'addreward',rNote:'addreward'};
  if(key==='stepTxt'){
    var btn=document.querySelector('[data-act="addstep"]');
    if(btn) handle('addstep',btn);
    return;
  }
  if(map[key]){
    var b=document.querySelector('[data-act="'+map[key]+'"]');
    if(b) handle(map[key],b);
  }
});
document.addEventListener('focusin',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-ui');
  if(k) FOCUS=k;
});

// midnight rollover while the page is open
setInterval(function(){
  if(D&&D.lastReset!==today()){ rollover(D); save(); render(); }
},60000);

load(); render();
})();
</script>
